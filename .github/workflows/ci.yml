name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No `version` input: pnpm is read from the `packageManager` field in
      # package.json, so local and CI use the same pnpm.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Node 24: the Worker build and `cf` need it locally too (24.22 or newer).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Run type check
        run: pnpm type-check

      - name: Run tests
        run: pnpm test

      # The build that goes live. The build refuses a missing or non-https
      # NEXT_PUBLIC_SITE_URL (src/lib/public-env.ts); placeholder only.
      - name: Build (Worker)
        run: pnpm build:vinext
        env:
          CLOUDFLARE_VITE_FORCE_LOCAL: "true"
          NEXT_PUBLIC_SITE_URL: https://ci-placeholder.example
